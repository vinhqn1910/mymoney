<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Plan</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <link rel="icon" type="image/png" href="logo2.png">
  <style>
    .table th, .table td{
      text-align:center;
      vertical-align:middle;
    }

    .plan-item{
      display:flex;
      gap:5px;
      margin-bottom:5px;
    }

    .plan-item input{
      flex:1;
    }
  </style>
</head>

<body>

    <div class="app">
    
      <!-- SIDEBAR -->
      <div id="sidebar" class="sidebar"></div>
    
      <div class="main">
    
        <!-- HEADER -->
        <div class="header">
          <div class="header-left">
            <button onclick="toggleSidebar()" class="toggle-btn">☰</button>
            <h3>Kế hoạch chi</h3>
          </div>
    
          <div class="header-right">
            <span id="userEmail">👤</span>
          </div>
        </div>
    
        <!-- CONTENT -->
        <div class="content">
    
          <div class="btn-group">
            <button onclick="openPopup('plan')">+ Khai báo</button>
          </div>
    
          <table id="planTable" class="table"></table>
          <h3 style="margin-top:30px;">Kế hoạch chi hằng ngày</h3>

          <table id="dailyTable" class="table"></table>
          
          <div id="dailyPagination" class="pagination"></div>
        </div>
      </div>
    </div>
    
    <!-- POPUP -->
    <div id="popup" class="popup hidden">
      <div class="popup-content" id="popupContent"></div>
    </div>
    
    <!-- TOAST -->
    <div id="toast"></div>
    
    <!-- SCRIPTS -->
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/loadMenu.js"></script> <!-- 🔥 QUAN TRỌNG -->
    <script src="js/plan.js"></script>
    
    <script>
    function toggleSidebar(){
      document.querySelector('.sidebar').classList.toggle('collapsed');
      document.querySelector('.main').classList.toggle('expanded');
    }
    
    // load user name
    firebase.auth().onAuthStateChanged(async (user) => {
      if (user) {
        const db = firebase.firestore();
    
        const snap = await db.collection("users")
          .where("email", "==", user.email)
          .get();
    
        snap.forEach((doc) => {
          document.getElementById("userEmail").innerText = "👤 " + doc.data().name;
        });
      }
    });
    </script>
    
    </body>
</html>
